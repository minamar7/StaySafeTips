name: 🛡️ Build Stay Safe Elite AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Install Bubblewrap
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli --ignore-scripts
          echo "✅ Bubblewrap CLI installed."

      # 5. Restore signing keystore
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
          if [ ! -s signing.keystore ]; then
            echo "❌ ERROR: signing.keystore was not created."
            exit 1
          fi
          echo "✅ Keystore restored successfully."

      # 6. Create Bubblewrap manifest
      - name: Create twa-manifest.json
        run: |
          python3 -c "
          import json
          manifest = {
            'packageId': 'com.minamar7.staysafetipselite',
            'host': 'minamar7.github.io',
            'name': 'Stay Safe Elite',
            'launcherName': 'Stay Safe',
            'display': 'standalone',
            'themeColor': '#020617',
            'navigationColor': '#020617',
            'navigationColorDark': '#020617',
            'navigationDividerColor': '#020617',
            'navigationDividerColorDark': '#020617',
            'backgroundColor': '#020617',
            'enableNotifications': False,
            'startUrl': '/StaySafeTips/',
            'iconUrl': 'https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png',
            'maskableIconUrl': 'https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png',
            'monochromeIconUrl': 'https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png',
            'splashScreenFadeOutDuration': 300,
            'signingKey': {
              'path': './signing.keystore',
              'alias': 'my-key-alias'
            },
            'appVersionCode': 23,
            'appVersionName': '1.0.0.23',
            'shortcuts': [],
            'generatorApp': 'bubblewrap-cli',
            'webManifestUrl': 'https://minamar7.github.io/StaySafeTips/manifest.json',
            'fallbackType': 'customtabs',
            'features': {
              'playBilling': {
                'enabled': True
              }
            },
            'alphaDependencies': {
              'enabled': False
            },
            'enableSiteSettingsShortcut': True,
            'isChromeOSOnly': False,
            'isMetaQuest': False,
            'fullScopeUrl': 'https://minamar7.github.io/StaySafeTips/',
            'minSdkVersion': 21,
            'targetSdkVersion': 36,
            'orientation': 'any',
            'fingerprints': []
          }
          with open('twa-manifest.json', 'w') as f:
            json.dump(manifest, f, indent=2)
          "
          echo "✅ twa-manifest.json created."

      # 7. Configure Bubblewrap paths
      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF
          echo "✅ Bubblewrap config written."

      # 8. Initialize Bubblewrap project
      - name: Initialize Android project
        timeout-minutes: 10
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI: true
        run: |
          printf 'n\nn\nn\n' | bubblewrap init \
            --manifest=twa-manifest.json \
            --skipPwaValidation
          if [ ! -f "app/build.gradle" ]; then
            echo "❌ ERROR: app/build.gradle was not created."
            exit 1
          fi
          echo "✅ Bubblewrap Android project initialized."

      # 9. Force Android SDK 36
      - name: Force Android API 36
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' app/build.gradle
            sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/g' app/build.gradle
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' app/build.gradle
            sed -i -E 's/targetSdk[[:space:]]+[0-9]+/targetSdk 36/g' app/build.gradle
          fi
          echo "✅ Android SDK 36 forced."

      # 10. Force Google Play Billing 9.1.0
      - name: Force Google Play Billing 9.1.0
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i -E 's/com\.android\.billingclient:billing:[^"'"'"']+/com.android.billingclient:billing:9.1.0/g' app/build.gradle
          fi
          echo "✅ Google Play Billing 9.1.0 configured."

      # 11. Enable R8
      - name: Enable R8 optimization
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' app/build.gradle
            sed -i 's/shrinkResources false/shrinkResources true/g' app/build.gradle
          fi
          echo "✅ R8 optimization enabled."

      # 12. Copy custom AndroidManifest.xml
      - name: Install custom AndroidManifest
        run: |
          if [ -f "AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ Custom AndroidManifest.xml copied."
          fi

      # 13. Copy custom Java / Kotlin files
      - name: Install custom Android source files
        run: |
          mkdir -p app/src/main/java/com/minamar7/staysafetipselite/
          if [ -f "SplashAdActivity.java" ]; then
            cp -f SplashAdActivity.java app/src/main/java/com/minamar7/staysafetipselite/
          fi
          if [ -f "SplashAdActivity.kt" ]; then
            cp -f SplashAdActivity.kt app/src/main/java/com/minamar7/staysafetipselite/
          fi

      # 14. Verify Gradle configuration
      - name: Verify SDK and Billing configuration
        run: |
          if [ ! -f "app/build.gradle" ]; then
            echo "❌ app/build.gradle NOT FOUND."
            exit 1
          fi
          if ! grep -q "36" app/build.gradle; then
            echo "❌ API 36 was NOT found in app/build.gradle."
            exit 1
          fi
          if ! grep -q "billing:9.1.0" app/build.gradle; then
            echo "❌ Google Play Billing 9.1.0 was NOT found."
            exit 1
          fi
          echo "✅ Verification passed!"

      # 15. Build signed AAB
      - name: Build signed AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI: true
        run: |
          printf "n\nn\n" | bubblewrap build --skipPwaValidation

      # 16. Locate generated AAB
      - name: Locate generated AAB
        run: |
          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)
          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No AAB file was generated."
            exit 1
          fi
          echo "✅ Found AAB file."

      # 17. Upload AAB artifact
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stay-safe-elite-aab
          path: |
            *.aab
            app/*.aab
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
