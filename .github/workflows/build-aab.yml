name: Build Stay Safe Elite AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-key-alias' }}
      # Βάλε 'true' όταν θέλεις να χρησιμοποιηθεί το δικό σου AndroidManifest.xml
      # και τα SplashAdActivity αρχεία. Αρχικά άφησέ το 'false'.
      USE_CUSTOM_ANDROID_FILES: 'false'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing.keystore"
          if [ ! -s "$GITHUB_WORKSPACE/signing.keystore" ]; then
            echo "ERROR: signing.keystore was not created. Check KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << EOF
          {
            "packageId": "com.minamar7.staysafetipselite",
            "host": "minamar7.github.io",
            "name": "Stay Safe Elite",
            "launcherName": "Stay Safe",
            "display": "standalone",
            "themeColor": "#020617",
            "navigationColor": "#020617",
            "navigationColorDark": "#020617",
            "navigationDividerColor": "#020617",
            "navigationDividerColorDark": "#020617",
            "backgroundColor": "#020617",
            "enableNotifications": true,
            "startUrl": "/StaySafeTips/",
            "iconUrl": "https://minamar7.github.io/StaySafeTips/icon_512.png",
            "maskableIconUrl": "https://minamar7.github.io/StaySafeTips/icon-maskable-512.png",
            "monochromeIconUrl": "https://minamar7.github.io/StaySafeTips/icon_512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "${KEY_ALIAS}"
            },
            "appVersionCode": 23,
            "appVersionName": "1.0.0.23",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://minamar7.github.io/StaySafeTips/manifest_v2.json",
            "fallbackType": "customtabs",
            "features": {
              "playBilling": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://minamar7.github.io/StaySafeTips/",
            "minSdkVersion": 24,
            "targetSdkVersion": 36,
            "orientation": "portrait",
            "fingerprints": []
          }
          EOF
          jq . twa-manifest.json > /dev/null

      - name: Check icons are reachable
        run: |
          for u in \
            https://minamar7.github.io/StaySafeTips/icon_512.png \
            https://minamar7.github.io/StaySafeTips/icon-maskable-512.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$u")
            echo "$code $u"
            if [ "$code" != "200" ]; then
              echo "ERROR: icon not reachable: $u"
              exit 1
            fi
          done

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF

      - name: Generate Android project
        timeout-minutes: 10
        env:
          CI: true
        run: |
          npx @bubblewrap/cli update --manifest=twa-manifest.json --skipVersionUpgrade --skipPwaValidation --force

      - name: Show generated project
        run: |
          ls -la
          test -f app/build.gradle || { echo "ERROR: app/build.gradle was not generated"; exit 1; }
          test -f gradlew || { echo "ERROR: gradlew was not generated"; exit 1; }
          chmod +x gradlew

      - name: Force Android API 36 & Min SDK 24
        run: |
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' app/build.gradle
          sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/g' app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' app/build.gradle
          sed -i -E 's/targetSdk[[:space:]]+[0-9]+/targetSdk 36/g' app/build.gradle
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' app/build.gradle
          sed -i -E 's/minSdk[[:space:]]+[0-9]+/minSdk 24/g' app/build.gradle

      - name: Force Google Play Billing 9.1.0
        run: |
          if grep -q "com.android.billingclient:billing" app/build.gradle; then
            sed -i -E "s#com\.android\.billingclient:billing:[^\"']+#com.android.billingclient:billing:9.1.0#g" app/build.gradle
          else
            echo 'dependencies { implementation "com.android.billingclient:billing:9.1.0" }' >> app/build.gradle
          fi

      - name: Enable R8 optimization
        run: |
          sed -i 's/minifyEnabled false/minifyEnabled true/g' app/build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/g' app/build.gradle

      - name: Install custom AndroidManifest and source files
        if: env.USE_CUSTOM_ANDROID_FILES == 'true'
        run: |
          MANIFEST=$(find . -maxdepth 1 -iname 'androidmanifest.xml' | head -n 1)
          if [ -n "$MANIFEST" ]; then
            echo "Using custom manifest: $MANIFEST"
            mkdir -p app/src/main
            cp -f "$MANIFEST" app/src/main/AndroidManifest.xml
          else
            echo "No custom manifest found, keeping Bubblewrap manifest"
          fi
          mkdir -p app/src/main/java/com/minamar7/staysafetipselite/
          for f in SplashAdActivity.java SplashAdActivity.kt; do
            if [ -f "$f" ]; then
              echo "Copying $f"
              cp -f "$f" app/src/main/java/com/minamar7/staysafetipselite/
            fi
          done

      - name: Build AAB with Gradle
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Sign AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "ERROR: $AAB not found"; find . -name '*.aab'; exit 1; }
          jarsigner \
            -keystore "$GITHUB_WORKSPACE/signing.keystore" \
            -storepass:env KS_PASS \
            -keypass:env KEY_PASS \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" stay-safe-elite-signed.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stay-safe-elite-aab
          path: stay-safe-elite-signed.aab
          if-no-files-found: error
          retention-days: 30
