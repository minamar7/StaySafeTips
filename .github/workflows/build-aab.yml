name: 🛡️ Build Stay Safe Elite AAB

on:
  workflow_dispatch:  # Τρέχει χειροκίνητα από το Actions tab

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      # ── 1. Κατέβασε τον κώδικα ──────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Εγκατάσταση Java 17 ──────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Εγκατάσταση Node.js ──────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 4. Εγκατάσταση Bubblewrap ───────────────────────
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ── 5. Δημιουργία Keystore από το GitHub Secret ─────
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore

      # ── 6. Δημιουργία twa-manifest.json ─────────────────
      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.minamar7.staysafetipselite",
            "host": "minamar7.github.io",
            "name": "Stay Safe Elite",
            "launcherName": "Stay Safe",
            "display": "standalone",
            "themeColor": "#020617",
            "navigationColor": "#020617",
            "navigationColorDark": "#020617",
            "navigationDividerColor": "#020617",
            "navigationDividerColorDark": "#020617",
            "backgroundColor": "#020617",
            "enableNotifications": false,
            "startUrl": "/StaySafeTips/",
            "iconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",
            "maskableIconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",
            "monochromeIconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "my-key-alias"
            },
            "appVersionCode": 22,
            "appVersionName": "1.0.0.22",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://minamar7.github.io/StaySafeTips/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "playBilling": { "enabled": true }
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://minamar7.github.io/StaySafeTips/",
            "minSdkVersion": 21,
            "targetSdkVersion": 36,
            "orientation": "any",
            "fingerprints": []
          }
          EOF

      # ── 7. Initialize & Inject Custom Manifest / Code / Dependencies ───
      - name: Initialize project and copy custom Android files
        timeout-minutes: 15
        run: |
          # 1. Δημιουργία του Android Project δομής από το twa-manifest.json
          yes | bubblewrap init --manifest=twa-manifest.json --skipPwaValidation

          # 2. Force compileSdkVersion & targetSdkVersion σε 36 (Android 16 / API 36)
          if [ -f "app/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' app/build.gradle
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' app/build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 36/g' app/build.gradle
          fi

          # 3. Force Google Play Billing v8.0.0+ στο build.gradle
          if [ -f "app/build.gradle" ]; then
            sed -i 's/com.android.billingclient:billing:[^"'"'"']*/com.android.billingclient:billing:8.0.0/g' app/build.gradle
          fi

          # 4. Ενεργοποίηση R8 Minification (για το 4ο warning των Android Vitals)
          if [ -f "app/build.gradle" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' app/build.gradle
            sed -i 's/shrinkResources false/shrinkResources true/g' app/build.gradle
          fi

          # 5. Αντικατάσταση του γενικού AndroidManifest.xml με το custom
          if [ -f "AndroidManifest.xml" ]; then
            cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 6. Αντιγραφή custom Java/Kotlin αρχείων (π.χ. SplashAdActivity)
          mkdir -p app/src/main/java/com/minamar7/staysafetipselite/
          if [ -f "SplashAdActivity.java" ]; then
            cp -f SplashAdActivity.java app/src/main/java/com/minamar7/staysafetipselite/
          fi
          if [ -f "SplashAdActivity.kt" ]; then
            cp -f SplashAdActivity.kt app/src/main/java/com/minamar7/staysafetipselite/
          fi

          # Ρητός έλεγχος: αν δεν δημιουργήθηκε το build.gradle, σταμάτα εδώ με σαφές μήνυμα
          if [ ! -f "app/build.gradle" ]; then
            echo "❌ Το app/build.gradle δεν δημιουργήθηκε — το bubblewrap init απέτυχε."
            exit 1
          fi

      # ── 8. Έλεγχος ότι οι τιμές όντως άλλαξαν ────────────
      - name: Verify SDK & Billing versions before build
        run: |
          echo "── Περιεχόμενο app/build.gradle (SDK & billing γραμμές) ──"
          if [ -f "app/build.gradle" ]; then
            grep -nE "compileSdk|targetSdk|minSdk|billingclient|minifyEnabled" app/build.gradle || echo "⚠️ Δεν βρέθηκαν σχετικές γραμμές — έλεγξε τη δομή του build.gradle."
          else
            echo "❌ Δεν βρέθηκε app/build.gradle — το bubblewrap init μάλλον απέτυχε."
            exit 1
          fi

      # ── 9. Build AAB ────────────────────────────────────
      - name: Build AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI: true
        run: |
          echo -e "n\nn\n" | bubblewrap build --skipPwaValidation 2>&1 || \
          yes n | bubblewrap build --skipPwaValidation

      # ── 10. Upload Artifact ──────────────────────────────
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stay-safe-elite-aab
          path: |
            *.aab
            app/*.aab
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
