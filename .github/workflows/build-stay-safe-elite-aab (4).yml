name: 🛡️ Build Stay Safe Elite AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4


      # ─────────────────────────────────────────────
      # 2. Java 17
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # ─────────────────────────────────────────────
      # 3. Node.js 22
      # ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ─────────────────────────────────────────────
      # 4. Install Bubblewrap
      # ─────────────────────────────────────────────
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli --ignore-scripts
          echo "✅ Bubblewrap CLI installed."


      # ─────────────────────────────────────────────
      # 5. Restore signing keystore
      # ─────────────────────────────────────────────
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore

          if [ ! -s signing.keystore ]; then
            echo "❌ ERROR: signing.keystore was not created."
            exit 1
          fi

          echo "✅ Keystore restored successfully."


      # ─────────────────────────────────────────────
      # 6. Create Bubblewrap manifest
      # ─────────────────────────────────────────────
      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.minamar7.staysafetipselite",
            "host": "minamar7.github.io",
            "name": "Stay Safe Elite",
            "launcherName": "Stay Safe",
            "display": "standalone",

            "themeColor": "#020617",
            "navigationColor": "#020617",
            "navigationColorDark": "#020617",
            "navigationDividerColor": "#020617",
            "navigationDividerColorDark": "#020617",
            "backgroundColor": "#020617",

            "enableNotifications": false,

            "startUrl": "/StaySafeTips/",

            "iconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",
            "maskableIconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",
            "monochromeIconUrl": "https://minamar7.github.io/StaySafeTips/icons/icon-512x512.png",

            "splashScreenFadeOutDuration": 300,

            "signingKey": {
              "path": "./signing.keystore",
              "alias": "my-key-alias"
            },

            "appVersionCode": 23,
            "appVersionName": "1.0.0.23",

            "shortcuts": [],

            "generatorApp": "bubblewrap-cli",

            "webManifestUrl": "https://minamar7.github.io/StaySafeTips/manifest.json",

            "fallbackType": "customtabs",

            "features": {
              "playBilling": {
                "enabled": true
              }
            },

            "alphaDependencies": {
              "enabled": false
            },

            "enableSiteSettingsShortcut": true,

            "isChromeOSOnly": false,
            "isMetaQuest": false,

            "fullScopeUrl": "https://minamar7.github.io/StaySafeTips/",

            "minSdkVersion": 21,

            "targetSdkVersion": 36,

            "orientation": "any",

            "fingerprints": []
          }
          EOF

          echo "✅ twa-manifest.json created."


      # ─────────────────────────────────────────────
      # 7. Initialize Bubblewrap project
      # ─────────────────────────────────────────────
      - name: Initialize Android project
        timeout-minutes: 15
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI: true
        run: |
          yes '' | bubblewrap init \
            --manifest=twa-manifest.json \
            --skipPwaValidation

          if [ ! -f "app/build.gradle" ]; then
            echo "❌ ERROR: app/build.gradle was not created."
            exit 1
          fi

          echo "✅ Bubblewrap Android project initialized."


      # ─────────────────────────────────────────────
      # 8. Force Android SDK 36
      # ─────────────────────────────────────────────
      - name: Force Android API 36
        run: |
          if [ -f "app/build.gradle" ]; then

            sed -i -E \
              's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
              app/build.gradle

            sed -i -E \
              's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/g' \
              app/build.gradle

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
              app/build.gradle

            sed -i -E \
              's/targetSdk[[:space:]]+[0-9]+/targetSdk 36/g' \
              app/build.gradle

          fi

          echo "✅ Android SDK 36 forced."


      # ─────────────────────────────────────────────
      # 9. Force Google Play Billing 8.0.0
      # ─────────────────────────────────────────────
      - name: Force Google Play Billing 8.0.0
        run: |
          if [ -f "app/build.gradle" ]; then

            sed -i -E \
              's/com\.android\.billingclient:billing:[^"'"'"']+/com.android.billingclient:billing:8.0.0/g' \
              app/build.gradle

          fi

          echo "✅ Google Play Billing 8.0.0 configured."


      # ─────────────────────────────────────────────
      # 10. Enable R8
      # ─────────────────────────────────────────────
      - name: Enable R8 optimization
        run: |
          if [ -f "app/build.gradle" ]; then

            sed -i \
              's/minifyEnabled false/minifyEnabled true/g' \
              app/build.gradle

            sed -i \
              's/shrinkResources false/shrinkResources true/g' \
              app/build.gradle

          fi

          echo "✅ R8 optimization enabled."


      # ─────────────────────────────────────────────
      # 11. Copy custom AndroidManifest.xml
      # ─────────────────────────────────────────────
      - name: Install custom AndroidManifest
        run: |
          if [ -f "AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ Custom AndroidManifest.xml copied."
          else
            echo "ℹ️ No custom AndroidManifest.xml found."
          fi


      # ─────────────────────────────────────────────
      # 12. Copy custom Java / Kotlin files
      # ─────────────────────────────────────────────
      - name: Install custom Android source files
        run: |

          mkdir -p \
            app/src/main/java/com/minamar7/staysafetipselite/

          if [ -f "SplashAdActivity.java" ]; then
            cp -f \
              SplashAdActivity.java \
              app/src/main/java/com/minamar7/staysafetipselite/

            echo "✅ SplashAdActivity.java copied."
          fi

          if [ -f "SplashAdActivity.kt" ]; then
            cp -f \
              SplashAdActivity.kt \
              app/src/main/java/com/minamar7/staysafetipselite/

            echo "✅ SplashAdActivity.kt copied."
          fi


      # ─────────────────────────────────────────────
      # 13. Verify Gradle configuration
      # ─────────────────────────────────────────────
      - name: Verify SDK and Billing configuration
        run: |

          echo ""
          echo "=========================================="
          echo "ANDROID BUILD CONFIGURATION"
          echo "=========================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "❌ app/build.gradle NOT FOUND."
            exit 1
          fi

          echo ""
          echo "SDK / Billing configuration:"
          grep -nE \
            "compileSdk|targetSdk|minSdk|billingclient|minifyEnabled|shrinkResources" \
            app/build.gradle || true

          echo ""
          echo "=========================================="

          if ! grep -q "36" app/build.gradle; then
            echo "❌ API 36 was NOT found in app/build.gradle."
            exit 1
          fi

          if ! grep -q "billing:8.0.0" app/build.gradle; then
            echo "❌ Google Play Billing 8.0.0 was NOT found."
            exit 1
          fi

          echo "✅ API 36 detected."
          echo "✅ Billing 8.0.0 detected."
          echo "=========================================="


      # ─────────────────────────────────────────────
      # 14. Build signed AAB
      # ─────────────────────────────────────────────
      - name: Build signed AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI: true
        run: |

          echo ""
          echo "=========================================="
          echo "BUILDING STAY SAFE ELITE AAB"
          echo "=========================================="

          printf "n\nn\n" | bubblewrap build \
            --skipPwaValidation

          echo ""
          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="


      # ─────────────────────────────────────────────
      # 15. Find generated AAB
      # ─────────────────────────────────────────────
      - name: Locate generated AAB
        run: |

          echo ""
          echo "Generated AAB files:"
          echo "------------------------------------------"

          find . \
            -type f \
            -name "*.aab" \
            -print

          echo "------------------------------------------"

          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No AAB file was generated."
            exit 1
          fi

          echo "✅ Found $AAB_COUNT AAB file(s)."


      # ─────────────────────────────────────────────
      # 16. Upload AAB artifact
      # ─────────────────────────────────────────────
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stay-safe-elite-aab
          path: |
            *.aab
            app/*.aab
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
